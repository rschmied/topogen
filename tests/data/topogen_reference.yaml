nodes:
  - boot_disk_size: null
    configuration:
      - name: node.cfg
        content: |-
          !
          frr defaults traditional
          hostname R1
          log syslog informational
          no ipv6 forwarding
          service integrated-vtysh-config
          !
          int lo
              ip address 10.0.0.1/32
              ip ospf passive
          !
          ip route 0.0.0.0/0 172.16.0.14
          !
          router ospf
              ospf router-id 10.0.0.1
              network 10.0.0.1/32 area 0
              network 172.16.0.1/30 area 0
              network 172.16.0.5/30 area 0
              network 172.16.0.13/30 area 0
              default-information originate
          !
          interface eth0
              description to R2 eth0
              ip address 172.16.0.1/30
              no shutdown
          !
          interface eth1
              description to R3 eth0
              ip address 172.16.0.5/30
              no shutdown
          !
          interface eth2
              description to dns-host eth1
              ip address 172.16.0.13/30
              no shutdown
          !
          !
      - name: boot.sh
        content: |-
          #!/bin/bash
          echo "nameserver 172.16.0.14" >/etc/resolv.conf
          echo "search virl.lab" >>/etc/resolv.conf
          exit 0
      - name: protocols
        content: |-
          ospfd
          bgpd
